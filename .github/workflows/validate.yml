name: Offline validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POWERSHELL_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (official tag; GitHub-verified commit)
        with:
          persist-credentials: false
      - name: Verify and install locked test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modules = Join-Path $env:RUNNER_TEMP 'toolkit-verified-modules'
          python3 -B ./tools/install_ci_dependencies.py $modules
          if ($LASTEXITCODE -ne 0) { throw 'CI dependency verification failed.' }
          "PSModulePath=$modules$([IO.Path]::PathSeparator)$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Analyze PowerShell and run mocked tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 6.2.0 -ErrorAction Stop
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -ErrorAction Stop
          $PSVersionTable
          Get-Module Pester,PSScriptAnalyzer | Select-Object Name,Version
          ./tests/Invoke-Validation.ps1
          $issues = @(Invoke-ScriptAnalyzer -Path ./examples -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          if ($issues.Count) { throw 'Example static analysis failed.' }
      - name: Validate packaging and public documentation
        run: |
          python3 --version
          python3 -B -m unittest discover -s tests -p 'test_*.py'
          python3 -B tools/check_public_content.py
      - name: Exercise the fictional offline example
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP ('toolkit-demo-' + [guid]::NewGuid().ToString('N') + '.html')
          $demo = ./examples/Invoke-CommunityOfflineDemo.ps1 -OutputPath $output
          if ($demo.RealVmwareValidated -or $demo.Changes.Count -ne 5) { throw 'Unexpected demo contract.' }
